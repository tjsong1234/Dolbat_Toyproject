# Pixel thresholds for the CURRENT saved 640x480 BEV; not physical calibration.
# This profile deliberately contains no ROI or perspective coordinates.
marking_suppression:
  raw_paint_min_channel: 175
  raw_paint_max_saturation: 65
  horizontal_length_px: 95
  horizontal_thickness_px: 2
  horizontal_padding_px: 5
  stripe_min_area: 600
  stripe_min_height_px: 55
  stripe_width_range_px: [18, 130]
  stripe_min_fill: 0.50
  stripe_min_half_thickness_px: 9
  stripe_min_height_width_ratio: 1.3
  stripe_group_min_count: 3
  stripe_min_vertical_overlap: 0.65
  stripe_max_height_ratio: 1.7
  stripe_max_width_ratio: 2.2
  stripe_max_spacing_cv: 0.45
  stripe_padding_px: 7
lane_validation:
  min_row_pixels: 5
  max_row_spread_px: 65
  min_supported_rows: 80
  min_support_fraction: 0.35
  max_unsupported_gap_px: 150
  # A clipped dash can contribute only 8-15 rows while another dash remains long.
  min_rows_per_half: 8
  min_rows_per_window: 8
  min_row_run_length: 8
  row_run_bridge_gap_px: 2
