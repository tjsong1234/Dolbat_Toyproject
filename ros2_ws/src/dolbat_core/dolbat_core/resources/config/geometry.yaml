# Separate the processing ROI from the four planar homography anchors.
# The target is this recording's lane to the RIGHT of the dashed divider.
preprocessing:
  processing_width: 640
  bev_size: [640, 640]
  roi_polygon: [[0.0, 0.43], [1.0, 0.43], [1.0, 1.0], [0.0, 1.0]]
  destination_points: [[0.14, 0.14], [0.86, 0.14], [0.86, 0.82], [0.14, 0.82]]
  refined_min_half_thickness_px: 2.7
  min_component_area: 45
  road_neighborhood: 15
  mask_mode: white_thickness
  white_max_saturation: 55
  green_channel_excess: 14
marking_overrides:
  mode: thickness_local
  horizontal_length_px: 68
  horizontal_max_vertical_thickness_px: 25
  # A horizontal seed alone must not erase a connected, bending lane.
  horizontal_min_component_span_px: 34
  horizontal_max_center_slope: 0.35
  horizontal_max_center_rms_px: 4.0
  stripe_min_area: 380
  stripe_min_height_px: 48
  stripe_width_range_px: [12, 100]
  stripe_min_half_thickness_px: 6.5
lane_detection:
  windows: 16
  margin_px: 45
  min_pixels_window: 14
  min_pixels_fit: 90
  min_y_coverage: 0.225
  min_occupied_windows: 4
  max_residual_px: 8.0
  nominal_lane_width_px: 360.0
  width_range_px: [250.0, 470.0]
  max_width_variation_px: 110.0
  min_overlap_px: 100
  row_min_width_px: 4
  row_max_width_px: 40
  min_node_rows: 6
  max_link_gap_windows: 5
  link_margin_px: 23
  max_slope_change_per_px: 0.014
  beam_per_node: 2
  max_temporal_jump_px: 70
  max_missed_frames: 5
  bounded_smoothing_px: 2.5
  target_lane: right_of_dashed
lane_validation:
  min_row_pixels: 4
  max_row_spread_px: 40
  min_supported_rows: 68
  min_support_fraction: 0.32
  max_unsupported_gap_px: 150
  min_rows_per_half: 8
  min_rows_per_window: 6
  min_row_run_length: 8
  row_run_bridge_gap_px: 2
example_frames: [0, 7, 30, 100, 140, 172, 180, 205, 250, 280, 290, 302, 310, 318, 335, 430, 452, 500, 516, 520, 535, 539, 541, 547, 555, 563]
